# 🚀 SignumLBRI Enhanced - Minimal Docker Setup
version: '3.8'

services:
  # Enhanced Application Only
  signumlbri-enhanced:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signumlbri-enhanced
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - USE_MEMORY_DB=true
      - SESSION_SECRET=enhanced-secret-key-production-change-this
      - DEFAULT_LANGUAGE=pl
      - DEFAULT_THEME=light
      - ENABLE_ANALYTICS=true
      - ENABLE_NOTIFICATIONS=true
      - DEBUG=signumlbri:*
    restart: unless-stopped
    volumes:
      - uploads-enhanced:/app/public/uploads
      - logs-enhanced:/app/logs
    labels:
      - "com.docker.compose.project=signumlbri-enhanced"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Volumes
volumes:
  uploads-enhanced:
    name: signumlbri-enhanced-uploads
  logs-enhanced:
    name: signumlbri-enhanced-logs
