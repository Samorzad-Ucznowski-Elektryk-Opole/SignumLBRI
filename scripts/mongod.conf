# MongoDB Configuration for Production Security
# Based on MongoDB 7.0 best practices

# Network interfaces
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 1000
  
# Security settings
security:
  authorization: enabled
  javascriptEnabled: false  # Disable server-side JavaScript for security
  
# Storage engine
storage:
  dbPath: /data/db
  journal:
    enabled: true
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1  # Limit cache size
      journalCompressor: snappy
      directoryForIndexes: true
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# System log
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: rename
  component:
    accessControl:
      verbosity: 1
    command:
      verbosity: 1

# Process management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
  pidFilePath: /var/run/mongodb/mongod.pid

# Operation profiling (for performance monitoring)
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100

# Replication (for future scaling)
# replication:
#   replSetName: signumlbri-rs

# Set parameters for security
setParameter:
  authenticationMechanisms: SCRAM-SHA-1,SCRAM-SHA-256
  scramIterationCount: 15000
  suppressNoTLSPeerCertificateWarning: true
  maxLogSizeKB: 10
  logLevel: 1
