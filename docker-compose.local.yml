services:
  mongo:
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - './data:/data/db'
    networks:
      - app-network

  signumlbri:
    build:
      context: .
      dockerfile: ./Dockerfile.debug
    restart: always
    ports:
      - "3000:3000"
      - "9229:9229"
    environment:
      NODE_ENV: development
      SESSION_SECRET: "development-secret-key"
      MONGODB_URI: mongodb://mongo:27017/signumlbri
      MONGODB_URI_LOCAL: mongodb://mongo:27017/signumlbri
      MAIL_HOST: 
      MAIL_USER: 
      MAIL_SHOWMAIL: true
      MAIL_PASSWORD: 
    volumes:
      - ./public/uploads:/usr/src/app/dist/public/uploads
    depends_on:
      - mongo
    command: ["npm", "run", "watch-debug"]
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
