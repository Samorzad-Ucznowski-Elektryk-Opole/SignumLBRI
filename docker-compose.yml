services:
  mongo:
    image: mongo:7
    container_name: signumlbri-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: signumlbri
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - signumlbri-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: signumlbri-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - signumlbri-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: signumlbri-app
    restart: always
    ports:
      - "80:4000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:admin123@mongo:27017/signumlbri?authSource=admin
      - REDIS_URL=redis://redis:6379
      - PORT=4000
      - SESSION_SECRET=signum-lbri-production-secret-2024
      - BCRYPT_ROUNDS=12
      - JWT_SECRET=signum-jwt-secret-2024
    volumes:
      - ./public/uploads:/app/public/uploads:rw
      - ./logs:/app/logs:rw
      - app-cache:/app/.cache
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - signumlbri-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
  app-cache:
    driver: local

networks:
  signumlbri-network:
    driver: bridge
