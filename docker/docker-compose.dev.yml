# SignumLBRI Development Environment - 2025 Ultra Edition
# Local development with hot-reload, debugging, and all services
# Ports: 8080 (HTTP), 8443 (HTTPS), 3000 (App Dev), 27017 (MongoDB), 6379 (Redis)

version: "3.8"

services:
  # MongoDB Database for Development
  mongo-dev:
    image: mongo:7-jammy
    restart: unless-stopped
    container_name: signum-mongodb-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: signum_dev
      MONGO_INITDB_ROOT_PASSWORD: dev_password_2025
      MONGO_INITDB_DATABASE: signumlbri_dev
    ports:
      - "27017:27017"  # Exposed for development tools
    volumes:
      - './data-dev:/data/db'
      - './mongo-init-dev:/docker-entrypoint-initdb.d'
    networks:
      - signum-dev-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache for Development
  redis-dev:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: signum-redis-dev
    command: redis-server --appendonly yes --requirepass dev_redis_2025
    ports:
      - "6379:6379"  # Exposed for development tools
    volumes:
      - './redis-data-dev:/data'
    networks:
      - signum-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Elasticsearch for Development (Advanced Search)
  elasticsearch-dev:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: signum-elasticsearch-dev
    restart: unless-stopped
    environment:
      - node.name=signum-es-dev-node
      - cluster.name=signum-dev-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"  # Exposed for development
    volumes:
      - './elasticsearch-data-dev:/usr/share/elasticsearch/data'
    networks:
      - signum-dev-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development Application with Hot-Reload
  signumlbri-dev:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
      args:
        NODE_VERSION: "20"
    restart: unless-stopped
    container_name: signum-app-dev
    environment:
      # Server Configuration
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      
      # Debug & Development
      DEBUG: "signum:*"
      ENABLE_DEBUG: true
      ENABLE_PROFILING: true
      ENABLE_HOT_RELOAD: true
      
      # Security (Development)
      SESSION_SECRET: "development-session-secret-2025"
      JWT_SECRET: "development-jwt-secret-2025"
      
      # Database
      MONGODB_URI: mongodb://signum_dev:dev_password_2025@mongo-dev:27017/signumlbri_dev?authSource=admin
      REDIS_URI: redis://:dev_redis_2025@redis-dev:6379/0
      ELASTICSEARCH_URI: http://elasticsearch-dev:9200
      
      # Features (All Enabled for Development)
      ENABLE_COMPRESSION: true
      ENABLE_CACHING: true
      ENABLE_WEBSOCKETS: true
      ENABLE_REAL_TIME: true
      ENABLE_ANALYTICS: true
      ENABLE_API_V2: true
      ENABLE_ADVANCED_SEARCH: true
      ENABLE_FILE_UPLOAD: true
      ENABLE_EMAIL_DEBUG: true
      
      # Mail (Development)
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USER: ""
      MAIL_PASSWORD: ""
      MAIL_SHOWMAIL: true
    ports:
      - "3000:3000"  # Direct access to app for development
    volumes:
      - ./src:/app/src:ro
      - ./views:/app/views:ro
      - ./public:/app/public:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./webpack.config.js:/app/webpack.config.js:ro
      - ./public/uploads:/app/public/uploads
      - ./logs-dev:/app/logs
      - /app/node_modules  # Anonymous volume for node_modules
    depends_on:
      mongo-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
      elasticsearch-dev:
        condition: service_healthy
    networks:
      - signum-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx for Development (Ports 8080/8443)
  nginx-dev:
    image: nginx:alpine
    restart: unless-stopped
    container_name: signum-nginx-dev
    ports:
      - "8080:80"   # Main HTTP port
      - "8443:443"  # Main HTTPS port
    volumes:
      - ./nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./public:/var/www/static:ro
    depends_on:
      - signumlbri-dev
    networks:
      - signum-dev-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MailHog for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: signum-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - signum-dev-network

  # Adminer for Database Management
  adminer:
    image: adminer:latest
    container_name: signum-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mongo-dev
    networks:
      - signum-dev-network

  # Redis Commander for Redis Management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: signum-redis-commander
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: "local:redis-dev:6379:0:dev_redis_2025"
    networks:
      - signum-dev-network

networks:
  signum-dev-network:
    driver: bridge
    name: signum-dev-network

volumes:
  mongo-data-dev:
    driver: local
  redis-data-dev:
    driver: local
  elasticsearch-data-dev:
    driver: local
