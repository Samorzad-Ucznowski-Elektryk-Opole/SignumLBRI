services:
  # MongoDB Database - Simplified version
  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    container_name: signum-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - './data:/data/db'
    networks:
      - signum-network
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Redis Cache
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: signum-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-temp_password_change_me}
    volumes:
      - './redis-data:/data'
    networks:
      - signum-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  signum-network:
    driver: bridge
