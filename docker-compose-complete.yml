# 🚀 SignumLBRI Enhanced - Complete Docker Setup

services:
  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: signumlbri-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: signumlbri2024
      MONGO_INITDB_DATABASE: signumlbri
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - signumlbri-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Enhanced Application
  signumlbri-enhanced:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signumlbri-enhanced
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URI=mongodb://admin:signumlbri2024@mongodb:27017/signumlbri?authSource=admin
      - USE_MEMORY_DB=false
      - SESSION_SECRET=enhanced-secret-key-production-change-this
      - DEFAULT_LANGUAGE=pl
      - DEFAULT_THEME=light
      - ENABLE_ANALYTICS=true
      - ENABLE_NOTIFICATIONS=true
      - DEBUG=signumlbri:*
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
      - logs_data:/app/logs
    networks:
      - signumlbri-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Volumes
volumes:
  mongodb_data:
    driver: local
  uploads_data:
    driver: local  
  logs_data:
    driver: local

# Networks
networks:
  signumlbri-network:
    driver: bridge
