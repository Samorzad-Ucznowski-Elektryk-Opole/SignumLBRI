version: '3.8'

services:
  # MongoDB Database - Simplified
  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    container_name: signum-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: signum_admin
      MONGO_INITDB_ROOT_PASSWORD: signum_2025_secure
      MONGO_INITDB_DATABASE: signumlbri
    volumes:
      - './data:/data/db'
    ports:
      - "27017:27017"
    networks:
      - signum-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: signum-redis
    command: redis-server --appendonly yes --requirepass signum_redis_2025
    volumes:
      - './redis-data:/data'
    ports:
      - "6379:6379"
    networks:
      - signum-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  signum-network:
    driver: bridge
    name: signum-network

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
